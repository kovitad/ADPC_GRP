# Local Docker Desktop stack for demos and PostgreSQL checks. Not for servers.
# Start it with: .\scripts\docker-desktop.ps1
name: grp-desktop

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: grp
      POSTGRES_USER: grp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - grp_desktop_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grp -d grp"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: grp-api:desktop
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &grp-env
      GRP_ENV: dev
      GRP_PUBLIC_BASE_URL: http://127.0.0.1:8000
      STORAGE_ROOT: /srv/grp/data
      DATABASE_URL_FILE: /run/grp-secrets/database_url
      SESSION_SECRET_FILE: /run/grp-secrets/session_secret
      SIG_MCP_BASE_URL: https://servirplatform.sig-gis.com/mcp
      SERVIR_AUTH_ISSUER: https://welcoming-splendor-62-staging.authkit.app
      SERVIR_AUTH_CLIENT_ID: ${SERVIR_AUTH_CLIENT_ID:-}
      SERVIR_AUTH_REDIRECT_URI: http://127.0.0.1:8000/api/v1/auth/callback
      SERVIR_AUTH_CLIENT_SECRET_FILE: /run/grp-secrets/servir_auth_client_secret
      # Local demo only: AI build switch on so the Platform Admin can test the gateway.
      AI_FEATURE_ENABLED: "true"
      # ADR-0004: planner chat box and map on SIG generic evidence, Docker Desktop only.
      PLANNING_CHAT_ENABLED: "true"
      # ADR-0006: Admin data inspector over the read-only source folder below.
      DATA_INSPECTOR_ENABLED: "true"
      DATA_IN_ROOT: /srv/grp/data-in
      # Draft methods run only here, for the SYNTHETIC test case (never on servers).
      ALLOW_DRAFT_METHODS: "true"
      # Local testing clicks through pages quickly; servers keep the Section 13.1 limit of 60.
      RATE_LIMITS: '{"api_requests_per_person_per_minute":300,"new_assessments_per_person_per_hour":10,"sig_evidence_reads_per_minute":30,"ai_requests_per_person_per_hour":20}'
      AI_PROVIDER: openai
      AI_MODEL: ${AI_MODEL:-gpt-5.2}
      AI_KEY_FILE_ADPC: /run/grp-secrets/ai_key_adpc
      AI_MAX_OUTPUT_TOKENS: "900"
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY_FILE: /run/grp-secrets/langfuse_secret_key
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-development}
      SIG_SERVICE_TOKEN_HASH_FILE: /run/grp-secrets/sig_service_token_hash
    volumes: &grp-secrets
      - ../.local/docker/secrets:/run/source-secrets:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    image: grp-api:desktop
    pull_policy: never
    environment: *grp-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../.local/docker/secrets:/run/source-secrets:ro
      - ../web:/app/web:ro
      - grp_desktop_data:/srv/grp/data
      - ../.local/data-in:/srv/grp/data-in:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: grp-api:desktop
    pull_policy: never
    command: ["python", "-m", "worker.main"]
    environment: *grp-env
    volumes:
      - ../.local/docker/secrets:/run/source-secrets:ro
      - grp_desktop_data:/srv/grp/data
      - ../.local/data-in:/srv/grp/data-in:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  postgres_password:
    file: ../.local/docker/secrets/postgres_password

volumes:
  grp_desktop_db:
  grp_desktop_data:
