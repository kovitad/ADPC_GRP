name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,gis]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Check deployment scripts
        run: bash -n deploy/*.sh

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: grp
          POSTGRES_USER: grp
          POSTGRES_PASSWORD: grp_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grp -d grp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_FILE: ${{ github.workspace }}/.ci-secrets/database_url
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,gis]"
      - name: Configure CI database
        run: |
          install -d -m 0700 .ci-secrets
          printf '%s' 'postgresql+psycopg://grp:grp_ci_password@127.0.0.1:5432/grp' > .ci-secrets/database_url
          chmod 0600 .ci-secrets/database_url
      - name: Migrate PostgreSQL from empty
        run: python -m alembic upgrade head
      - name: Verify migration head
        run: python -m alembic current --check-heads
      - name: Run golden tests
        run: python -m pytest tests/golden
